# Referência da configuração do serviço no Render (o serviço real foi criado pelo painel).
# Valores secretos ficam só no painel: Render → licitafacil-api → Environment.
services:
  - type: web
    name: licitafacil-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://licitafacil-one.vercel.app
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TRIAL_DAYS
        value: 15
      - key: MAX_FILE_SIZE_MB
        value: 50
