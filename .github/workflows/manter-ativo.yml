name: Manter banco ativo
# O Supabase grátis pausa o projeto quando não vê atividade no banco durante 7 dias (pausou em 12/11/2026 com 1 consulta por dia).
# Agora: 4 vezes por dia, lendo as tabelas de verdade (?manter=1). Se o banco não responder, a execução FALHA e o GitHub avisa por e-mail.
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'   # 4 vezes por dia (22:17, 04:17, 10:17 e 16:17 de Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar a API (toca o banco)
        run: |
          ok=0
          for url in "https://licitafacil-one.vercel.app/api/health?manter=1" "https://licitafacil-api-kxks.onrender.com/api/health?manter=1"; do
            codigo=$(curl -s -m 90 -o resposta.json -w "%{http_code}" "$url" || echo "000")
            echo "$codigo $url $(head -c 200 resposta.json 2>/dev/null)"
            if [ "$codigo" = "200" ]; then ok=1; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Banco fora do ar. Se o Supabase pausou o projeto: supabase.com/dashboard → projeto do LicitaFácil → Resume project."
            exit 1
          fi
